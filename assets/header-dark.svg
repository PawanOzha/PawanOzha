<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Pawan Ojha — Full-stack engineer">
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0C10" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0A0C10" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0A0C10" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6E8BFF"/>
      <stop offset="0.5" stop-color="#9B7BFF"/>
      <stop offset="1" stop-color="#3DDC97"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#7C6CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: Inter, "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .dot { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
      @media (prefers-reduced-motion: reduce) { .dot { animation: none } }
    </style>
  </defs>
  <rect width="1200" height="320" rx="16" fill="#0A0C10"/>
  <rect width="1200" height="320" rx="16" fill="url(#g)"/>
  <rect width="1200" height="320" rx="16" fill="url(#glow)"/>
  <rect width="760" height="320" rx="16" fill="url(#fade)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="15.5" fill="none" stroke="#1E232C"/>

  <g transform="translate(64 0)">
    <circle class="dot" cx="6" cy="78" r="4" fill="#3DDC97"/>
    <text x="20" y="83" class="mono" font-size="13" letter-spacing="2" fill="#8B93A1">KATHMANDU, NEPAL · OPEN TO CONTRACT WORK</text>
    <text x="0" y="150" class="sans" font-size="64" font-weight="700" letter-spacing="-2" fill="#F2F4F8">Pawan Ojha</text>
    <rect x="2" y="172" width="72" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="0" y="214" class="sans" font-size="24" font-weight="500" fill="#F2F4F8">Full-stack engineer — I build and ship web products end to end.</text>
    <text x="0" y="250" class="mono" font-size="15" fill="#8B93A1">Next.js · TypeScript · Go · Rust · FastAPI · Docker</text>
  </g>

  <g transform="translate(812 64)">
    <rect width="324" height="192" rx="12" fill="#11141A" stroke="#1E232C"/>
    <circle cx="20" cy="20" r="5" fill="#1E232C"/><circle cx="38" cy="20" r="5" fill="#1E232C"/><circle cx="56" cy="20" r="5" fill="#1E232C"/>
    <text x="304" y="25" text-anchor="end" class="mono" font-size="11" fill="#8B93A1">ship.log</text>
    <line x1="0" y1="40" x2="324" y2="40" stroke="#1E232C"/>
    <g class="mono" font-size="13">
      <text x="20" y="72" fill="#8B93A1"><tspan fill="#8A9BFF">$</tspan> git push origin main</text>
      <path d="M20 97 l3.5 3.5 l6.5 -7" fill="none" stroke="#3DDC97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="102" fill="#8B93A1"><tspan fill-opacity="0">$ </tspan>detected Next.js</text>
      <path d="M20 127 l3.5 3.5 l6.5 -7" fill="none" stroke="#3DDC97" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="20" y="132" fill="#8B93A1"><tspan fill-opacity="0">$ </tspan>built · container up</text>
      <text x="20" y="162" fill="#F2F4F8"><tspan fill="#3DDC97">●</tspan> live over HTTPS</text>
    </g>
  </g>
</svg>
